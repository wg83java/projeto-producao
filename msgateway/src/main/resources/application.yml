spring:
  application:
    name: msgateway
    
  cloud:
    gateway:
      discovery:
        locator:
          lower-case-service-id: true
          
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_SERVER}:${KEYCLOAK_PORT}/realms/msproducaorealm
          
          
server:
  port: 8080
  
  
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://login:senha@${EUREKA_SERVER}:8761/eureka
